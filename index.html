<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>Lançamentos PCP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#17212b; --muted:#5d6b7a; --line:#d9dee5;
  --pri:#1f4e79; --pri-ink:#fff; --pri-soft:#e3edf7; --ok:#1e7a46; --ok-soft:#e2f4ea;
  --warn:#9a5b00; --warn-soft:#fff2d9; --bad:#b3261e; --bad-soft:#fde7e5;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f151b; --card:#18212b; --ink:#e8edf2; --muted:#9aa8b6; --line:#2b3744;
  --pri:#5b9bd5; --pri-ink:#0b1520; --pri-soft:#1c2c3d; --ok:#5fcf8d; --ok-soft:#173326;
  --warn:#f0b955; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1c1a;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:var(--pri-ink);padding:10px 16px calc(10px);display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:10px;padding:4px 8px}
.datebox{flex:none}.datebox input{background:transparent;border:0;color:inherit;font-weight:600;font-size:16px;width:8.6em;min-width:0}
.datebox input::-webkit-calendar-picker-indicator{filter:invert(1)}
@media (prefers-color-scheme: dark){.datebox input::-webkit-calendar-picker-indicator{filter:none}}
.diaLev{margin:10px 16px 0;padding:8px 12px;border-radius:10px;background:var(--pri-soft);color:var(--pri);font-size:15px;text-align:center}
.diaLev b{}
.notice{margin:10px 16px 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
main{padding:12px 16px 110px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 4px 14px;font-size:15px;font-weight:600;color:var(--muted)}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px}
.chip b{color:var(--pri)}
.chip.sel{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}.chip.sel b{color:inherit}
.chip.ghost{color:var(--muted);font-weight:500;border-style:dashed}
h2{font-size:15px;color:var(--muted);font-weight:600;margin:4px 0 10px;text-transform:uppercase;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.big{border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:68px;padding:10px;font-size:19px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.big small{font-size:12px;font-weight:500;color:var(--muted)}
.big:active,.prod:active{background:var(--pri-soft)}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;font-size:16px}
.list{display:flex;flex-direction:column;gap:8px}
.prod{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 12px;min-height:58px;font-size:15.5px;font-weight:600;width:100%}
.prod span{flex:1}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--pri-soft);color:var(--pri)}
.prod.other{justify-content:center;border-style:dashed;color:var(--pri)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;background:var(--pri);color:var(--pri-ink)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack>*+*{margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.muted{color:var(--muted);font-size:14px}
.group{margin:16px 0 6px;font-weight:700;font-size:14px;color:var(--muted)}
.entry{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.entry.dup{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.entry .top{display:flex;gap:10px;align-items:flex-start}
.entry .name{flex:1;font-weight:600;font-size:15px}
.entry .qty{font-size:20px;font-weight:800}
.entry .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center;font-size:13px;color:var(--muted)}
.entry .obs{margin-top:6px;font-size:13px;font-style:italic;color:var(--muted)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:17px}
.qty-in{width:100%;font-size:40px;font-weight:800;text-align:center;padding:12px;border:2px solid var(--pri);border-radius:14px;background:var(--bg)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea.field{min-height:70px;resize:vertical}
.link{background:none;border:0;color:var(--pri);font-weight:600;padding:8px 0}
.toast{position:fixed;left:16px;right:16px;bottom:84px;z-index:30;background:var(--ok);color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--bad)}
.calc{margin-top:8px;text-align:center;font-size:18px;min-height:26px}.calc b{font-size:24px;color:var(--ok)}
.err{color:var(--bad);font-size:15px;font-weight:600}
.big small.ok{color:var(--ok);font-weight:700}.big small.warn{color:var(--warn);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
@media (max-width:360px){.grid{grid-template-columns:repeat(2,1fr)} header{padding:8px 12px;gap:6px} header h1{font-size:14px} .datebox{padding:4px 6px} .datebox input{font-size:15px;width:7.9em} main{padding-left:12px;padding-right:12px}}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <h1>Lançamentos PCP</h1>
  <label class="datebox" title="Data do levantamento">📅<input type="date" id="dataLev" aria-label="Data do levantamento"></label>
</header>
<div id="notice"></div>
<main id="view"></main>
<nav>
  <button data-tab="lancar" class="on">Lançar</button>
  <button data-tab="revisar">Revisar <span id="nRev"></span></button>
  <button data-tab="exportar">Exportar</button>
</nav>
<div id="sheetHost"></div>
<div id="toastHost"></div>
<script src="vendor/xlsx.full.min.js"></script>
<script src="cadastro.js?v=1.3.0"></script>
<script src="app.js?v=1.3.0"></script>
</body>
</html>
